spring:
  application:
    name: anomaly-detection-backend
  datasource:
    url: jdbc:postgresql://postgres:5432/cyberguard_db
    username: postgres
    password: securepassword123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

server:
  port: 8080

ai-engine:
  base-url: http://ai-engine:8000

security:
  jwt:
    secret: change-this-to-a-long-random-secret-in-production
    issuer: anomaly-detection-backend
    expiration-minutes: 60
  ingest:
    api-key: change-this-static-api-key-in-production