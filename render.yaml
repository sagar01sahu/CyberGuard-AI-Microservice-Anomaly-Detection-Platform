# 2. Java Spring Boot Backend
- type: web
  name: cyberguard-backend
  runtime: docker
  dockerfilePath: ./anomaly-detection-backend_v2/Dockerfile
  dockerContext: ./anomaly-detection-backend_v2
  plan: free
  envVars:
    - key: PORT
      value: "8080"
    - key: SPRING_PROFILES_ACTIVE
      value: "dev"
    # Map individual database components from Render
    - key: DB_HOST
      fromDatabase:
        name: cyberguard-db
        property: host
    - key: DB_PORT
      fromDatabase:
        name: cyberguard-db
        property: port
    - key: DB_NAME
      fromDatabase:
        name: cyberguard-db
        property: database
    - key: SPRING_DATASOURCE_USERNAME
      fromDatabase:
        name: cyberguard-db
        property: user
    - key: SPRING_DATASOURCE_PASSWORD
      fromDatabase:
        name: cyberguard-db
        property: password
    # Construct the proper JDBC URL that Spring Boot requires
    - key: SPRING_DATASOURCE_URL
      value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    - key: AI_ENGINE_URL
      value: https://cyberguard-ai-engine.onrender.com