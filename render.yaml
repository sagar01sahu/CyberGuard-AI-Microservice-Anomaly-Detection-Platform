services:
  # 1. Python PyTorch AI Engine
  - type: web
    name: cyberguard-ai-engine
    runtime: docker
    dockerfilePath: ./subproblem_3/Dockerfile
    dockerContext: ./subproblem_3
    plan: free
    envVars:
      - key: PORT
        value: "8000"

  # 2. Java Spring Boot Backend
  - type: web
    name: cyberguard-backend
    runtime: docker
    dockerfilePath: ./anomaly-detection-backend_v2/Dockerfile
    dockerContext: ./anomaly-detection-backend_v2
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: "dev"
      - key: DATABASE_URL
        fromDatabase:
          name: cyberguard-db
          property: connectionString
      - key: AI_ENGINE_URL
        value: https://cyberguard-ai-engine.onrender.com

  # 3. Synthetic Log Generator & Attack Control Service
  - type: web
    name: cyberguard-generator
    runtime: docker
    dockerfilePath: ./subproblem-1_v3/Dockerfile
    dockerContext: ./subproblem_1_v3
    plan: free
    envVars:
      - key: PORT
        value: "8001"
      - key: API_URL
        value: https://cyberguard-backend.onrender.com/api/v1/logs/ingest

  # 4. React Frontend (Vite / Nginx)
  - type: web
    name: cyberguard-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: PORT
        value: "80"

databases:
  - name: cyberguard-db
    databaseName: cyberguard_db
    plan: free